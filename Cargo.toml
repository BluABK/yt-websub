[package]
name = "yt-websub"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Minimal YouTube WebSub (PubSubHubbub) notification server for streamarchiver"
license = "MIT OR Apache-2.0"
repository = ""

[dependencies]
# Blocking HTTP/1.1 server with correct framing + HTTPS (rustls) for the single :443 listener.
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
# Blocking HTTPS client (rustls) for outbound subscribe/renew + handle resolution.
ureq = "2"
# X-Hub-Signature HMAC-SHA1 verification (RustCrypto; tiny, pure Rust).
hmac = "0.12"
sha1 = "0.10"
# OS RNG for per-subscription secrets/tokens (cross-platform).
getrandom = "0.2"

# Vendored tiny_http with a local DoS fix: upstream's EqualReader::drop
# allocates the full remaining Content-Length in one Vec, so one request
# claiming a huge body ("Content-Length: 18446744073709551615") panics with
# "capacity overflow" — which panic=abort escalates to killing the process.
# Unfixed upstream as of 2026-07 (master still allocates unbounded).
# See vendor/tiny_http/src/util/equal_reader.rs and tests/huge_content_length.rs.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
