[package]
name = "yt-websub"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Minimal YouTube WebSub (PubSubHubbub) notification server for streamarchiver"
license = "MIT OR Apache-2.0"
repository = ""

[dependencies]
# Blocking HTTP/1.1 server with correct framing + HTTPS (rustls) for the single :443 listener.
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
# Blocking HTTPS client (rustls) for outbound subscribe/renew + handle resolution.
ureq = "2"
# X-Hub-Signature HMAC-SHA1 verification (RustCrypto; tiny, pure Rust).
hmac = "0.12"
sha1 = "0.10"
# OS RNG for per-subscription secrets/tokens (cross-platform).
getrandom = "0.2"

# Vendored tiny_http with several local hardening patches for an internet-exposed
# listener (all marked "LOCAL PATCH (yt-websub)"), none fixed upstream as of 2026-07:
#   - equal_reader.rs: bound the unread-body drain (was: alloc full Content-Length
#     -> "capacity overflow" panic -> abort). See tests/huge_content_length.rs.
#   - client.rs: cap request/header line length + header count (was: unbounded
#     buffering -> OOM). See tests/oversized_headers.rs.
#   - connection.rs: per-socket read/write timeouts (was: none -> slowloris).
#   - util/task_pool.rs: bounded, non-panicking worker spawn (was: unbounded
#     thread::spawn -> panic/abort at the TasksMax pid ceiling).
#   - ssl/rustls.rs: non-panicking private-key loader (was: expect()/index panic).
#   - lib.rs: bounded request-completion wait in the HTTPS client loop (was:
#     unbounded recv() -> a request whose notify never fires eats a pool worker
#     forever; 19 eaten workers made the 2026-08-22 relay deaf to new
#     connections, including hub pushes, while existing keep-alives stayed
#     green). On timeout the connection is dropped and the worker reclaimed.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# panic=abort is load-bearing: the code uses `.lock().unwrap()` throughout and
# relies on the first panic aborting the process (systemd restarts it) rather than
# poisoning a mutex and cascading. See the note in src/app.rs.
panic = "abort"

[profile.dev]
# Match release poisoning semantics so a debug run of the server fails the same,
# systemd-restartable way instead of poison-cascading its mutexes. (cargo forces
# unwind for the test profile automatically, so `cargo test` is unaffected.)
panic = "abort"
